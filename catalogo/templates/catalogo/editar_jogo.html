<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Jogo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        label {
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h1>Editar Jogo</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Nome:</label>
        <input type="text" name="nome" value="{{ jogo.nome }}">

        <br><br>

        <label>Descrição:</label>
        <textarea name="descricao">{{ jogo.descricao }}</textarea>

        <br><br>

        <label>Gênero:</label>
        <input type="text" name="genero" value="{{ jogo.genero }}">

        <br><br>

        <label>Status:</label>
        <input type="text" name="status" value="{{ jogo.status }}">

        <br><br>

        <label>Nota:</label>
        <input type="number" name="nota" min="0" max="10" value="{{ jogo.nota }}">

        <br><br>

        <button type="submit">Salvar alterações</button>
    </form>

    <a href="{% url 'lista_jogos' %}">Voltar para o catálogo</a>

</body>
</html>
