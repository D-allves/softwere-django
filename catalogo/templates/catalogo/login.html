<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Catálogo de Jogos</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111827;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 16px;
            padding: 32px;
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
            font-size: 26px;
        }

        .subtitulo {
            text-align: center;
            color: #9ca3af;
            margin: 0 0 24px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #6366f1;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #6366f1;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #4f46e5; }

        .erro {
            background: #7f1d1d;
            color: #fecaca;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🎮 Entrar</h1>
        <p class="subtitulo">Acesse seu catálogo de jogos</p>

        {% if form.errors %}
            <div class="erro">Usuário ou senha incorretos.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="id_username">Usuário</label>
            <input type="text" name="username" id="id_username" autofocus required>

            <label for="id_password">Senha</label>
            <input type="password" name="password" id="id_password" required>

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
