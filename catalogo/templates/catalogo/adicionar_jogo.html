<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Jogo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            background: #111827;
            color: #f9fafb;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: #1f2937;
            padding: 35px;
            border-radius: 16px;
            border: 1px solid #374151;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            margin: 0 0 10px;
            font-size: 30px;
        }

        .subtitulo {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #374151;
            border-radius: 9px;
            background: #111827;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #6366f1;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        select {
            cursor: pointer;
        }

        .salvar {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #22c55e;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .salvar:hover {
            background: #16a34a;
            transform: translateY(-2px);
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #a5b4fc;
            text-decoration: none;
        }

        .voltar:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>➕ Adicionar Jogo</h1>

        <p class="subtitulo">
            Adicione um novo jogo ao seu catálogo.
        </p>

        <form method="POST">

            {% csrf_token %}

            <label>Nome do jogo</label>

            <input
                type="text"
                name="nome"
                placeholder="Ex: Minecraft"
                required
            >

            <label>Descrição</label>

            <textarea
                name="descricao"
                placeholder="Digite uma descrição do jogo..."
                required
            ></textarea>

            <label>Gênero</label>

            <select name="genero" required>

                <option value="">Selecione um gênero</option>
                <option value="Ação">Ação</option>
                <option value="Aventura">Aventura</option>
                <option value="RPG">RPG</option>
                <option value="FPS">FPS</option>
                <option value="MOBA">MOBA</option>
                <option value="Sandbox">Sandbox</option>
                <option value="Esporte">Esporte</option>
                <option value="Terror">Terror</option>
                <option value="Outro">Outro</option>

            </select>

            <label>Status</label>

            <select name="status" required>

                <option value="">Selecione o status</option>
                <option value="Já joguei">Já joguei</option>
                <option value="Quero jogar">Quero jogar</option>

            </select>

            <label>Nota</label>

            <input
                type="number"
                name="nota"
                min="0"
                max="10"
                placeholder="0 a 10"
                required
            >

            <button class="salvar" type="submit">
                💾 Adicionar Jogo
            </button>

        </form>

        <a class="voltar" href="{% url 'lista_jogos' %}">
            ← Voltar para o catálogo
        </a>

    </div>

</body>
</html>
